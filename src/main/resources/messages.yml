prestige-not-enough: "%prefix%&cPrestiging costs &6%cost%&c. You need &6%needed% &cmore."
prestige-max: "%prefix%&eYou have reached the highest prestige. Congratulations!"
prestige-success: "%prefix%&d&lPRESTIGE! &7You are now &dPrestige %prestige% &7and back at rank %rank_prefix%&7."
prestige-max-success: "%prefix%&aYou prestiged &f%count% &atime(s). You are now &dPrestige %prestige% &aat rank %rank_prefix%&a."
prestige-broadcast: "%prefix%&f%player% &7is now &dPrestige %prestige%&7!"
prestige-reward: "%prefix%&6&lPRIZE! &ePrestige %prestige% reward: &f%reward%"
