# ============================================================
#  PrisonCore - messages
#  Colour codes: &a, &l ... and hex colours like &#FFAA00.
#  %prefix% is replaced with the prefix below. Set a message to "" to turn it off.
# ============================================================

prefix: "&8[&6Prison&8] &r"

# ---- General
players-only: "%prefix%&cOnly players can use this command."
player-not-found: "%prefix%&cPlayer &f%player% &chas never joined this server."
