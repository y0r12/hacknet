# ---- Ranks
rankup-success: "%prefix%&aYou ranked up to %rank_prefix% &afor &6%cost%&a!"
rankup-not-enough: "%prefix%&cYou need &6%needed% &cmore to rank up to %rank_prefix% &7(costs &6%cost%&7)&c."
rankup-max-rank: "%prefix%&eYou are at the highest rank! Use &6/prestige &eto prestige."
rankup-max-success: "%prefix%&aYou ranked up &f%count% &atime(s) to %rank_prefix% &afor &6%cost%&a."
rankup-broadcast: "%prefix%&f%player% &7ranked up to %rank_prefix%&7."
rankup-final-broadcast: "%prefix%&f%player% &7reached the final rank %rank_prefix%&7!"
ranks-header: "%prefix%&6Ranks &7(prices at prestige %prestige%)"
ranks-line: " %rank_prefix% &7- &f%cost%"
ranks-line-current: " %rank_prefix% &7- &f%cost% &a< you are here"

# ---- Prestige
prestige-disabled: "%prefix%&cPrestiging is turned off on this server."
