# ============================================================
#  PrisonCore - ranks
#  Players start at the first rank and buy their way down the list with /rankup.
#  The order of this list is the order of the ladder.
#
#  cost         price to rank up INTO this rank at prestige 0 (the first rank is free).
#               Prestige makes every rank more expensive - see prestige.yml.
#  prefix       tag shown in chat, menus and on the scoreboard.
#  permissions  (optional) extra permissions a player has from this rank onwards,
#               for example ["essentials.warps.vipmine", "essentials.kits.miner"].
#  commands     (optional) console commands run when a player reaches this rank,
#               for example ["give %player% diamond 5"]. %player% and %rank% are replaced.
#
#  Players automatically get prisoncore.rank.<rank> for their rank and every rank below it,
#  and prisoncore.mine.<mine> for every mine their rank unlocks.
#
#  Quick ways to change prices in-game:
#    /prison rank setcost <rank> <cost>
#    /prison rank autocost <firstCost> <multiplier>   (re-prices the whole ladder)
# ============================================================

settings:
  # Announce every rank-up to the whole server.
  broadcast-rankup: false
  # Announce when a player reaches the final rank.
  broadcast-final-rank: true

