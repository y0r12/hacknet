# ============================================================
#  PrisonCore - sell prices
#  What /sellall and autosell pay for ONE of each item, before multipliers.
#  Items that are not listed cannot be sold.
#  In-game: /prison price set <item|hand> <price>, /prison price remove <item|hand>, /prison price list
#
#  The defaults are balanced against the default ranks and mine presets: each mine pays about
#  a third more per block than the one before it. A block made from 9 items is always worth
#  exactly 9 items, so crafting never creates money.
# ============================================================

prices:
  # Mine A-B
  COBBLESTONE: 4
  STONE: 4
  ANDESITE: 5.25

  # Coal
  COAL: 7
  COAL_ORE: 7
  COAL_BLOCK: 63

